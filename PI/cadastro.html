<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Encontre sua Babá</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="CSS/cadastro.css">
 
</head>
 
<body>
 
    <div class="container">
 
        <div class="card">
 
            <h2>Criar Conta</h2>
 
            <p class="subtitulo">
                Cadastre-se para encontrar uma babá ou oferecer seus serviços.
            </p>
 
            <form>
 
                <div class="form-grid">
 
                    <div class="campo campo-full">
                        <label>Tipo de Cadastro</label>
 
                        <select required>
                            <option value="">Selecione</option>
                            <option>Pai / Responsável</option>
                            <option>Babá</option>
                        </select>
                    </div>
 
                    <div class="campo campo-full">
                        <label>Nome Completo</label>
                        <input type="text" placeholder="Digite seu nome completo" required>
                    </div>
 
                    <div class="campo">
                        <label>CPF</label>
                        <input type="text" placeholder="000.000.000-00" required>
                    </div>
 
                    <div class="campo">
                        <label>Data de Nascimento</label>
                        <input type="date" required>
                    </div>
 
                    <div class="campo">
                        <label>Telefone</label>
                        <input type="tel" placeholder="(11) 99999-9999" required>
                    </div>
 
                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" placeholder="email@exemplo.com" required>
                    </div>
 
                    <div class="campo">
                        <label>Senha</label>
                        <input type="password" placeholder="********" required>
                    </div>
 
                    <div class="campo">
                        <label>Confirmar Senha</label>
                        <input type="password" placeholder="********" required>
                    </div>
 
                    <div class="termos">
 
                        <input type="checkbox" required>
 
                        <label>
                            Li e aceito os Termos de Uso e a Política de Privacidade.
                        </label>
 
                    </div>
 
                    <button type="submit">
                        Criar Conta
                    </button>
 
                </div>
 
            </form>
 
            <div class="login">
 
                Já possui uma conta?
 
                <br><br>
 
                <a href="login.html">
                    Entrar
                </a>
 
            </div>
 
        </div>
 
    </div>
 
</body>
 
</html>
