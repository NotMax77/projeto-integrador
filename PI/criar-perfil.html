<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./CSS/terminar-cadastro.css">

<title>Complete seu Perfil</title>

</head>

<body>

<div class="container">

<div class="card">

<h2>Complete seu Perfil</h2>

<p class="sub">
Adicione uma foto e conte um pouco sobre você.
</p>

<form id="perfilForm">

<div class="foto">

<img
id="preview"
src="https://via.placeholder.com/140"
alt="Foto">

<label class="botaoFoto" for="fotoPerfil">
Escolher Foto
</label>

<input
type="file"
id="fotoPerfil"
accept="image/*">

</div>

<div class="campo">

<label>Nome de usuário</label>

<input
type="text"
id="usuario">

</div>

<div class="campo">

<label>Bio (Opcional)</label>

<textarea
id="bio"
placeholder="Conte um pouco sobre você..."></textarea>

</div>

<button type="button" onclick="window.location.href='index.html'">
    Finalizar Cadastro
</button>

</form>

</div>

</div>

<script>

// Recupera o nome salvo anteriormente
const nome = localStorage.getItem("nomeUsuario");

if(nome){
    document.getElementById("usuario").value = nome;
}

// Pré-visualização da foto
document.getElementById("fotoPerfil").addEventListener("change", function(){

    const arquivo = this.files[0];

    if(arquivo){

        const leitor = new FileReader();

        leitor.onload = function(e){

            document.getElementById("preview").src = e.target.result;

        }

        leitor.readAsDataURL(arquivo);

    }

});

// Salva as informações
document.getElementById("perfilForm").addEventListener("submit", function(e){

    e.preventDefault();

    localStorage.setItem(
        "usuario",
        document.getElementById("usuario").value
    );

    localStorage.setItem(
        "bio",
        document.getElementById("bio").value
    );

    alert("Perfil criado com sucesso!");

    // Próxima página
    // window.location.href = "home.html";

});

</script>

</body>
</html>
